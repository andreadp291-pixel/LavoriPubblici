<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LavoriPubblici - Mappa</title>
  <link rel="stylesheet" href="css/style.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>
<body>
  <div class="map-header">
    <a class="back-link" href="dashboard.html">&larr; Dashboard</a>
    <h1 id="page-title">Mappa</h1>
    <button class="btn-logout" onclick="logout()">Esci</button>
  </div>

  <div id="draw-toolbar" class="draw-toolbar" hidden>
    <span id="draw-idle-controls">
      <button id="btn-draw-point" hidden>+ Punto</button>
      <button id="btn-draw-line" hidden>+ Linea</button>
      <button id="btn-draw-polygon" hidden>+ Area</button>
    </span>
    <span id="draw-active-controls" hidden>
      <span class="draw-hint" id="draw-hint"></span>
      <button id="btn-draw-finish" class="btn-save">Fine</button>
      <button id="btn-draw-cancel">Annulla</button>
    </span>
  </div>

  <div id="map"></div>
  <div class="legend">
    <span><span class="dot" style="background:hsl(120,65%,40%)"></span> Fatto di recente</span>
    <span><span class="dot" style="background:hsl(60,65%,45%)"></span> Da un po'</span>
    <span><span class="dot" style="background:hsl(0,65%,45%)"></span> Da molto tempo</span>
    <span><span class="dot" style="background:#555"></span> Mai eseguito</span>
  </div>

  <div id="element-panel" class="element-panel" hidden>
    <div class="element-panel-inner">
      <div class="element-panel-header">
        <h2 id="panel-title">Dettagli</h2>
        <button class="panel-close" id="panel-close">&times;</button>
      </div>
      <label>Nota</label>
      <textarea id="panel-note"></textarea>
      <label>Programmato per il</label>
      <input type="date" id="panel-programmata" />
      <label>Ultima esecuzione</label>
      <input type="date" id="panel-ultima" />
      <div class="error-msg" id="panel-error"></div>
      <div class="popup-actions">
        <button class="btn-save" id="panel-edit" hidden>Modifica</button>
        <button class="btn-save" id="panel-save" hidden>Salva</button>
        <button class="btn-delete" id="panel-delete" hidden>Elimina</button>
      </div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
