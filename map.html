<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LavoriPubblici - Mappa</title>
  <link rel="stylesheet" href="css/style.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>
<body class="map-page">
  <div class="map-header">
    <a class="back-link" href="dashboard.html">&larr; Dashboard</a>
    <h1 id="page-title">Mappa</h1>
    <button class="btn-logout" onclick="logout()">Esci</button>
  </div>

  <div id="draw-toolbar" class="draw-toolbar" hidden>
    <span id="draw-idle-controls">
      <button id="btn-draw-point" hidden>+ Punto</button>
      <button id="btn-draw-line" hidden>+ Linea</button>
      <button id="btn-draw-polygon" hidden>+ Area</button>
      <button id="btn-import-osm" hidden>Importa alberi/siepi da OSM</button>
    </span>
    <span id="draw-active-controls" hidden>
      <span class="draw-hint" id="draw-hint"></span>
      <button id="btn-draw-undo">&#8630; Ultimo punto</button>
      <button id="btn-draw-finish" class="btn-save">Fine</button>
      <button id="btn-draw-cancel">Annulla</button>
    </span>
    <span id="osm-select-controls" hidden>
      <span class="draw-hint">Clicca su altre strade per selezionarne più di una; trascina i pallini per scegliere il tratto.</span>
      <button id="btn-osm-import-selection" class="btn-save">Importa questo tratto</button>
      <button id="btn-osm-cancel-selection">Annulla selezione</button>
    </span>
  </div>

  <div id="map"></div>
  <div class="legend">
    <span><span class="dot" style="background:hsl(120,65%,40%)"></span> Fatto di recente</span>
    <span><span class="dot" style="background:hsl(60,65%,45%)"></span> Da un po'</span>
    <span><span class="dot" style="background:hsl(0,65%,45%)"></span> Da molto tempo</span>
    <span><span class="dot" style="background:#555"></span> Mai eseguito</span>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
