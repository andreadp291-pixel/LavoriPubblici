<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LavoriPubblici - Cambio password</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <h1>Imposta una nuova password</h1>
    <p class="subtitle">Al primo accesso devi scegliere una password personale</p>
    <form id="pw-form">
      <label for="new_password">Nuova password</label>
      <input type="password" id="new_password" autocomplete="new-password" required />
      <label for="confirm_password">Conferma password</label>
      <input type="password" id="confirm_password" autocomplete="new-password" required />
      <p class="hint">Minimo 10 caratteri, con almeno una maiuscola, una minuscola, un numero e un carattere speciale (!@#$%&amp;*).</p>
      <div class="error-msg" id="error-msg"></div>
      <button type="submit" class="btn-primary">Salva e continua</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    requireAuth({ allowPasswordChange: true });

    document.getElementById("pw-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById("new_password").value;
      const confirmPassword = document.getElementById("confirm_password").value;
      const errorEl = document.getElementById("error-msg");
      errorEl.textContent = "";

      if (newPassword !== confirmPassword) {
        errorEl.textContent = "Le due password non coincidono";
        return;
      }

      try {
        await apiFetch("/api/me/password", {
          method: "POST",
          body: JSON.stringify({ new_password: newPassword }),
        });
        window.location.href = "dashboard.html";
      } catch (err) {
        errorEl.textContent = err.message || "Errore durante il salvataggio";
      }
    });
  </script>
</body>
</html>
