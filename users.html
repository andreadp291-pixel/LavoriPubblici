<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LavoriPubblici - Gestione utenti</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="dashboard-wrap users-wrap">
    <div class="dashboard-header">
      <h1>Gestione utenti</h1>
      <div class="header-actions">
        <a class="back-link" href="dashboard.html">&larr; Dashboard</a>
        <button class="btn-logout" onclick="logout()">Esci</button>
      </div>
    </div>

    <form id="create-form" class="card-form">
      <h2>Nuovo utente</h2>
      <div class="form-row">
        <div>
          <label for="username">Username</label>
          <input type="text" id="username" required />
        </div>
        <div>
          <label for="display_name">Nome visualizzato</label>
          <input type="text" id="display_name" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div>
          <label for="role">Livello</label>
          <select id="role">
            <option value="viewer">Visualizzatore (sola lettura)</option>
            <option value="editor">Editor (può modificare)</option>
          </select>
        </div>
      </div>
      <div class="error-msg" id="create-error"></div>
      <button type="submit" class="btn-primary">Crea utente e invia credenziali</button>
    </form>

    <div id="last-created" class="notice" hidden></div>

    <table class="users-table">
      <thead>
        <tr>
          <th>Utente</th>
          <th>Nome</th>
          <th>Email</th>
          <th>Livello</th>
          <th>Stato</th>
          <th>Azioni</th>
        </tr>
      </thead>
      <tbody id="users-tbody"></tbody>
    </table>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
